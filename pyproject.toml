[tool.ruff]
target-version = "py311"
line-length = 88
src = ["apps/desktop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE001", "S110", "T201", "TRY300", "ERA", "ARG", "RUF002", "RUF003", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN205", "ANN206", "SIM", "C4", "RET", "TCH", "FA", "PERF", "PIE", "FURB", "TRY", "RUF", "INP001", "PTH", "PLR2004", "PLW2901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]

[tool.ruff.lint.pylint]
# Thresholds set just above the current worst case in the codebase so the
# rules act as a future guard without flagging existing functions.
max-args = 10
max-positional-args = 8
max-returns = 13
max-branches = 21
max-statements = 244

[tool.ruff.lint.per-file-ignores]
"apps/desktop/build/*.py" = ["T201", "INP001"]